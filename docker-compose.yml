services:
  # 1. Cơ sở dữ liệu MySQL
  mysql-db:
    image: mysql:8.0
    container_name: smartrecipe-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smart_recipe_db
    ports:
      - "3306:3306"
    volumes:
      # Lưu trữ dữ liệu cố định (không bị mất khi restart container)
      - db_data:/var/lib/mysql
      # Tự động chạy script khởi tạo Database khi bật container lần đầu tiên
      - ./sql/init_database.sql:/docker-entrypoint-initdb.d/init_database.sql:ro
    networks:
      - smartrecipe-network

  # 2. Redis Cache
  redis-cache:
    image: redis:7-alpine
    container_name: smartrecipe-redis
    ports:
      - "6379:6379"
    networks:
      - smartrecipe-network

  # 3. Backend (Spring Boot) - Chỉ dùng khi muốn chạy full bằng Docker
  backend-api:
    build:
      context: ./smartrecipe-backend
      dockerfile: .docker/Dockerfile
    container_name: smartrecipe-backend
    ports:
      - "8080:8080"
    environment:
      # Khi chạy trong Docker, URL trỏ tới hostname của container MySQL
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/smart_recipe_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - mysql-db
      - redis-cache
    networks:
      - smartrecipe-network

  # 4. Frontend (React) - Chỉ dùng khi muốn chạy full bằng Docker
  frontend-web:
    build:
      context: ./smartrecipe-frontend
      dockerfile: .docker/Dockerfile
    container_name: smartrecipe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-api
    networks:
      - smartrecipe-network

networks:
  smartrecipe-network:
    driver: bridge

volumes:
  db_data:
